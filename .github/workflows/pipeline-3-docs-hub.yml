name: Pipeline 3 - Central Docs MDX & Docusaurus Deploy

on:
  repository_dispatch:
    types: [json-data-updated]
  workflow_dispatch:

concurrency:
  group: pipeline-3-central-hub
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: GENERATE MDX FROM FRONTEND & BACKEND JSONS
  # ==========================================
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout central-docs-hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run compile_mdx.py (Frontend + Backend)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          echo "Triggered by: ${{ github.event.client_payload.source || 'manual' }}"
          python compile_mdx.py

      - name: Commit & Push Updated MDX
        id: commit_mdx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No new MDX changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: compile MDX from ${{ github.event.client_payload.source || 'central-hub' }} JSON"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================
  # JOB 2: SYNC TO DOCUSAURUS-HUB, BUILD & DEPLOY
  # ==========================================
  build-and-deploy:
    needs: generate-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout central-docs-hub
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone docusaurus-hub & Sync MDX + Images
        env:
          CENTRAL_REPO_PAT: ${{ secrets.CENTRAL_REPO_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${CENTRAL_REPO_PAT}@github.com/harshh122/docusaurus-hub.git" docusaurus-repo

          mkdir -p docusaurus-repo/docs docusaurus-repo/static/img
          if [ -d docs ]; then
            rsync -a --delete docs/ docusaurus-repo/docs/
          fi

          if [ -d frontend/images ]; then
            rsync -a --delete frontend/images/ docusaurus-repo/static/img/
          fi

      - name: Build Docusaurus Site
        working-directory: ./docusaurus-repo
        run: |
          npm ci
          npm run build

      - name: Push Updated Docs to docusaurus-hub
        working-directory: ./docusaurus-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs static/img

          if git diff --staged --quiet; then
            echo "Docusaurus docs already up to date."
          else
            git commit -m "chore: sync compiled MDX and assets from central-docs-hub"
            git pull --rebase origin main
            git push
          fi
