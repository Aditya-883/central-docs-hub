name: Pipeline 3 - Central Docs Hub
on:
 repository_dispatch:
   types: [json-data-updated]
 workflow_dispatch: # Manual test run ke liye
permissions:
 contents: write
jobs:
 generate-mdx:
   runs-on: ubuntu-latest
   timeout-minutes: 20
   steps:
     - name: Checkout Central Docs Hub
       uses: actions/checkout@v4
     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.11'
         cache: 'pip'
         cache-dependency-path: 'scripts/mdx-generator/requirements.txt'
     - name: Install AI Script Dependencies
       run: |
         python -m pip install --upgrade pip
         pip install -r scripts/mdx-generator/requirements.txt
     - name: Run MDX Generator
       env:
         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
       run: |
         python scripts/mdx-generator/Mdx_generator.py
     - name: Commit and Push Generated MDX & Hashes
       run: |
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git add -A
         if git diff --staged --quiet; then
           echo "No MDX or hash changes to commit."
         else
           git commit -m "docs: auto-generate MDX from ${{ github.event.client_payload.source || 'manual-run' }} [skip ci]"
           git push
         fi
