name: Pipeline 3 - Central Docs Hub

on:
  repository_dispatch:
    types: [json-data-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline-3-docs
  cancel-in-progress: false

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Central Docs Hub
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI Script Dependencies
        working-directory: scripts
        run: pip install -r requirements.txt

      - name: Ensure Output Folders Exist
        run: |
          mkdir -p docusaurus/docs
          mkdir -p docusaurus/static/img

      - name: Run AI MDX Generator
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python compile_mdx.py

      - name: Commit & Push Generated Docs
        run: |
          rm -rf scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docusaurus scripts
          [ -d docs ] && git add docs

          if git diff --staged --quiet; then
            echo "No doc changes to commit."
          else
            git commit -m "docs: auto-generate updated MDX files"
            git pull --rebase origin main
            git push
          fi

  build-and-deploy:
    needs: generate-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Latest Docs
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docusaurus/package-lock.json

      - name: Install & Build Docusaurus
        working-directory: docusaurus
        run: |
          npm ci
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docusaurus/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
