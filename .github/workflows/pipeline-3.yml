name: Pipeline 3 - AI MDX Generator

on:
  repository_dispatch:
    types: [json-data-updated]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild all MDX files (ignores .sync-manifest.json)'
        type: boolean
        default: false
      mock:
        description: 'Run in mock mode without calling Gemini API'
        type: boolean
        default: false

concurrency:
  group: pipeline-3-ai-mdx
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-sync-mdx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central-docs-hub
        uses: actions/checkout@v6

      - name: Setup Python (with pip cache)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'docusaurus/package-lock.json'

      - name: Install Tesseract OCR & Python Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr
          pip install -r requirements.txt

      - name: Run Offline Self-Test
        run: python3 scripts/compile_mdx.py --self-test

      - name: Compile JSON to MDX (AI)
        id: compile
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.force }}" = "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --force"; fi
          if [ "${{ inputs.mock }}" = "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --mock"; fi

          set +e
          python3 scripts/compile_mdx.py \
            --project-dir . \
            --docs-root ./docusaurus/docs \
            --static-root ./docusaurus/static \
            --manifest ./.sync-manifest.json \
            $EXTRA_FLAGS
          EXIT_CODE=$?
          set -e

          # Exit 2 = fatal error (missing key/Tesseract/LLM outage) -> abort job
          # Exit 1 = partial failure -> continue so completed MDX & manifest are saved
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "Fatal compiler error (exit code 2). Aborting."
            exit 2
          fi

      - name: Validate Docusaurus Build
        working-directory: ./docusaurus
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Commit & Push Validated MDX to central-docs-hub
        id: push_mdx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docusaurus/docs docusaurus/static
          if [ -f .sync-manifest.json ]; then
            git add .sync-manifest.json
          fi

          if git diff --staged --quiet; then
            echo "No MDX or manifest changes to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: sync AI-generated MDX and assets"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pipeline 4 (Docusaurus Deploy)
        if: steps.push_mdx.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CENTRAL_REPO_PAT }}
          repository: harshh122/central-docs-hub
          event-type: mdx-updated
          client-payload: '{"source": "pipeline-3"}'
